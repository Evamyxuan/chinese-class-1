<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中文课 · Китайский язык</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fdf6f0 0%, #fce8d5 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header .emoji {
      font-size: 56px;
      display: block;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2rem;
      color: #b94f1e;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    header p {
      color: #888;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 16px rgba(185,79,30,0.10);
      border: 2px solid transparent;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(185,79,30,0.18);
      border-color: #e8804a;
    }

    .card .lesson-num {
      font-size: 0.8rem;
      color: #e8804a;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card h2 {
      font-size: 1.15rem;
      color: #333;
    }

    .card .subtitle {
      font-size: 0.88rem;
      color: #999;
    }

    .card .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: #fff3ec;
      color: #c0532a;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.78rem;
    }

    .card .arrow {
      margin-top: 8px;
      color: #e8804a;
      font-size: 1.1rem;
      align-self: flex-end;
    }

    footer {
      text-align: center;
      margin-top: 56px;
      color: #bbb;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <span class="emoji">🈶</span>
  <h1>中文课 · Китайский язык</h1>
  <p>Нажмите на урок, чтобы начать повторение / 点击课程开始复习</p>
</header>

<div class="grid">

  <a class="card" href="урок1.html">
    <span class="lesson-num">Урок 1</span>
    <h2>Знакомство · 认识</h2>
    <span class="subtitle">Первый урок</span>
    <div class="tag-row">
      <span class="tag">家庭 семья</span>
      <span class="tag">国籍 национальность</span>
      <span class="tag">是 / 有</span>
    </div>
    <span class="arrow">→</span>
  </a>

  <!-- 以后每节课在这里添加一个新卡片，例如：
  <a class="card" href="урок2.html">
    <span class="lesson-num">Урок 2</span>
    <h2>…</h2>
    ...
  </a>
  -->

</div>

<footer>
  © 中文课 · Evamyxuan
</footer>

</body>
</html>
